[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-reco"
version = "0.1.0"
description = "CelebA fine-tune of VGGFace2 InceptionResNetV1 with CE, Triplet, and ArcFace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  # Pin below 2.6 avoids forcing a CUDA torch downgrade over a CPU wheel.
  "facenet-pytorch==2.5.3",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "gdown>=5.1",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
face-reco-download = "face_reco.cli:download_main"
face-reco-prepare = "face_reco.cli:prepare_main"
face-reco-train = "face_reco.cli:train_main"
face-reco-eval = "face_reco.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
face_reco = ["py.typed"]
